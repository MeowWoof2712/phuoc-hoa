<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poster tổng hợp – Không gian du lịch số Phước Hòa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700;800;900&display=swap">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{display:flex;flex-direction:column;background:#0b1411;color:#f4f2ec;font-family:'Be Vietnam Pro','Segoe UI',system-ui,Arial,sans-serif}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;padding:.8rem 1rem;border-bottom:1px solid rgba(244,242,236,.14);background:#0f1c17}
.bar h1{margin-right:auto;font-size:.95rem;font-weight:800;color:#ffd98a}
.bar small{font-size:.78rem;font-weight:600;color:rgba(244,242,236,.7)}
.btn{display:inline-flex;align-items:center;justify-content:center;height:2.6rem;padding:0 1.3rem;border:1px solid rgba(255,217,138,.5);border-radius:999px;background:rgba(255,255,255,.06);color:#ffd98a;font-weight:800;font-size:.86rem;line-height:1;font-family:inherit;cursor:pointer;transition:transform .2s,background .2s}
.btn:hover{transform:translateY(-1px);background:rgba(255,255,255,.14)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.go{border-color:transparent;background:linear-gradient(90deg,#d9a02f,#f6dd95,#d9a02f);color:#1a1205}
.btn.go:hover{background:linear-gradient(90deg,#f6dd95,#fff0c4,#f6dd95)}
#pick,#pickqr{display:none}
.stage{flex:1;min-height:0;display:grid;place-items:center;padding:1rem}
canvas{display:block;width:min(100%,calc((100vh - 7.2rem)*16/9));height:auto;aspect-ratio:16/9;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
</style>
</head>
<body>
<div class="bar">
  <h1>Poster tổng hợp · Không gian du lịch số Phước Hòa</h1>
  <small id="info">Đang tải…</small>
  <label class="btn" for="pick">Đổi ảnh nền</label>
  <input id="pick" type="file" accept="image/*">
  <label class="btn" for="pickqr">Chọn QR</label>
  <input id="pickqr" type="file" accept="image/*">
  <button class="btn" id="jpg" type="button" disabled>Xuất JPG 4K</button>
  <button class="btn go" id="png" type="button" disabled>Xuất PNG 4K</button>
</div>
<div class="stage"><canvas id="cv" width="3840" height="2160"></canvas></div>
<script>
(() => {
  const PHOTO = '';
  const W = 3840;
  const H = 2160;
  const S = 2;
  const QR_SRC = 'yt.png';
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const info = document.getElementById('info');
  const btnPng = document.getElementById('png');
  const btnJpg = document.getElementById('jpg');
  const st = { img: null, frost: null, frostFor: null, qr: null };

  const font = (w, s) => `${w} ${s}px "Be Vietnam Pro","Segoe UI",Arial,sans-serif`;
  const hasLS = 'letterSpacing' in ctx;
  const setLS = px => { if (hasLS) ctx.letterSpacing = px + 'px'; };
  const shadow = (c, b, y) => { ctx.shadowColor = c; ctx.shadowBlur = b * S; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = y * S; };
  const noShadow = () => { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0; };
  const mix = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k));

  const rr = (x, y, w, h, r) => {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  };

  const width = (t, f, ls = 0) => {
    ctx.font = f;
    setLS(ls);
    const w = ctx.measureText(t).width - (hasLS ? ls : 0);
    setLS(0);
    return w;
  };

  const text = (t, x, y, f, c, align = 'left', ls = 0) => {
    const w = width(t, f, ls);
    const x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
    ctx.font = f;
    ctx.fillStyle = c;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    setLS(ls);
    ctx.fillText(t, x0, y);
    setLS(0);
    return w;
  };

  const fit = (t, weight, size, max, ls = 0) => {
    while (size > 12 && width(t, font(weight, size), ls) > max) size--;
    return size;
  };

  const cover = (c, im, dx, dy, dw, dh) => {
    const iw = im.naturalWidth;
    const ih = im.naturalHeight;
    const k = Math.max(dw / iw, dh / ih);
    const sw = dw / k;
    const sh = dh / k;
    c.drawImage(im, (iw - sw) / 2, (ih - sh) / 2, sw, sh, dx, dy, dw, dh);
  };

  const buildFrost = () => {
    if (!st.img || !('filter' in ctx)) {
      st.frost = null;
      return;
    }
    if (st.frostFor === st.img) return;
    const c = document.createElement('canvas');
    c.width = W;
    c.height = H;
    const x = c.getContext('2d');
    if (!('filter' in x)) {
      st.frost = null;
      return;
    }
    x.filter = `blur(${26 * S}px) brightness(.62) saturate(1.15)`;
    cover(x, st.img, -120, -120, W + 240, H + 240);
    st.frost = c;
    st.frostFor = st.img;
  };

  const drawBg = () => {
    ctx.fillStyle = '#0b1411';
    ctx.fillRect(0, 0, 1920, 1080);
    if (st.img) cover(ctx, st.img, 0, 0, 1920, 1080);
    ctx.fillStyle = 'rgba(8,34,27,.2)';
    ctx.fillRect(0, 0, 1920, 1080);
    let g = ctx.createLinearGradient(0, 0, 0, 1080);
    g.addColorStop(0, 'rgba(4,10,8,.86)');
    g.addColorStop(.2, 'rgba(4,10,8,.64)');
    g.addColorStop(.36, 'rgba(4,10,8,.3)');
    g.addColorStop(.6, 'rgba(4,10,8,.18)');
    g.addColorStop(.85, 'rgba(4,10,8,.3)');
    g.addColorStop(1, 'rgba(3,8,6,.6)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 1920, 1080);
    g = ctx.createRadialGradient(960, 540, 420, 960, 540, 1150);
    g.addColorStop(0, 'rgba(2,6,5,0)');
    g.addColorStop(1, 'rgba(2,6,5,.5)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 1920, 1080);
  };

  const drawHead = () => {
    const f = font(800, 36);
    const label = 'TRƯỜNG THCS PHƯỚC HÒA';
    const tw = width(label, f, 7);
    const w = tw + 156;
    const x0 = 960 - w / 2;
    shadow('rgba(0,0,0,.5)', 24, 10);
    rr(x0, 38, w, 66, 33);
    ctx.fillStyle = 'rgba(7,15,12,.84)';
    ctx.fill();
    noShadow();
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(255,214,120,.65)';
    ctx.stroke();
    ctx.fillStyle = '#f4c95d';
    shadow('#f4c95d', 14, 0);
    [x0 + 50, x0 + w - 50].forEach(cx => {
      ctx.beginPath();
      ctx.arc(cx, 71, 7, 0, Math.PI * 2);
      ctx.fill();
    });
    noShadow();
    text(label, x0 + 84, 84, f, '#ffd98a', 'left', 7);
  };

  const drawTitle = () => {
    const a = 'KHÔNG GIAN DU LỊCH SỐ ';
    const b = 'PHƯỚC HÒA';
    let ts = 150;
    const total = s => width(a, font(900, s), -s * .02) + (hasLS ? -s * .02 : 0) + width(b, font(900, s), -s * .02);
    while (ts > 60 && total(ts) > 1780) ts -= 2;
    const tf = font(900, ts);
    const tl = -ts * .02;
    const gap = hasLS ? tl : 0;
    const wa = width(a, tf, tl);
    const sx = 960 - total(ts) / 2;
    const bx = sx + wa + gap;
    const base = 244;
    const A = [228, 236, 232];
    const B = [63, 80, 73];
    const GA = [246, 221, 149];
    const GB = [96, 62, 6];
    const depth = 12;
    for (let i = depth; i >= 1; i--) {
      if (i === depth) shadow('rgba(0,0,0,.7)', 50, 40);
      const k = (i - 1) / (depth - 1);
      text(a, sx, base + i * 1.1, tf, `rgb(${mix(A, B, k)})`, 'left', tl);
      text(b, bx, base + i * 1.1, tf, `rgb(${mix(GA, GB, k)})`, 'left', tl);
      if (i === depth) noShadow();
    }
    text(a, sx, base, tf, '#fff', 'left', tl);
    const gg = ctx.createLinearGradient(0, base - ts * .75, 0, base);
    gg.addColorStop(0, '#fff3c8');
    gg.addColorStop(1, '#f0c04e');
    text(b, bx, base, tf, gg, 'left', tl);

    const sub = 'HÀNH TRÌNH XANH QUA MIỀN KÍ ỨC';
    const sf = font(800, 46);
    const sw = width(sub, sf, 12);
    shadow('rgba(0,0,0,.7)', 16, 5);
    text(sub, 960, 332, sf, '#ffd98a', 'center', 12);
    noShadow();
    const lx = 960 - sw / 2 - 40;
    const rx = 960 + sw / 2 + 40;
    const lg = ctx.createLinearGradient(lx - 260, 0, lx, 0);
    lg.addColorStop(0, 'rgba(217,160,47,0)');
    lg.addColorStop(1, '#f6dd95');
    rr(lx - 260, 316, 260, 4, 2);
    ctx.fillStyle = lg;
    ctx.fill();
    const rg = ctx.createLinearGradient(rx, 0, rx + 260, 0);
    rg.addColorStop(0, '#f6dd95');
    rg.addColorStop(1, 'rgba(217,160,47,0)');
    rr(rx, 316, 260, 4, 2);
    ctx.fillStyle = rg;
    ctx.fill();
  };

  const drawPanel = () => {
    const x = 330;
    const y = 392;
    const w = 1260;
    const h = 600;

    ctx.save();
    shadow('rgba(0,0,0,.55)', 50, 20);
    rr(x, y, w, h, 44);
    ctx.fillStyle = 'rgba(7,15,12,.5)';
    ctx.fill();
    ctx.restore();

    ctx.save();
    rr(x, y, w, h, 44);
    ctx.clip();
    if (st.frost) {
      ctx.drawImage(st.frost, 0, 0, 1920, 1080);
      ctx.fillStyle = 'rgba(7,15,12,.5)';
    } else {
      ctx.fillStyle = 'rgba(7,15,12,.78)';
    }
    ctx.fillRect(x, y, w, h);
    const tg = ctx.createLinearGradient(x, 0, x + w, 0);
    tg.addColorStop(0, 'rgba(217,160,47,.2)');
    tg.addColorStop(1, 'rgba(217,160,47,0)');
    ctx.fillStyle = tg;
    ctx.fillRect(x, y, w, h);
    const dg = ctx.createLinearGradient(x, 0, x + w, 0);
    dg.addColorStop(0, '#d9a02f');
    dg.addColorStop(.5, '#f6dd95');
    dg.addColorStop(1, '#d9a02f');
    ctx.fillStyle = dg;
    ctx.fillRect(x, y, w, 8);
    ctx.restore();

    rr(x, y, w, h, 44);
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(255,217,138,.5)';
    ctx.stroke();

    const qs = 460;
    const qx = x + 60;
    const qy = y + (h - qs) / 2;
    const g = ctx.createLinearGradient(qx, qy, qx + qs, qy + qs);
    g.addColorStop(0, '#ffe7ab');
    g.addColorStop(.45, '#d9a02f');
    g.addColorStop(.7, '#8d5a05');
    g.addColorStop(1, '#f6dd95');
    rr(qx, qy, qs, qs, 34);
    ctx.fillStyle = g;
    ctx.fill();
    rr(qx + 12, qy + 12, qs - 24, qs - 24, 24);
    ctx.fillStyle = '#fff';
    ctx.fill();
    const q = st.qr;
    if (q) {
      const iw = q.naturalWidth || 512;
      const ih = q.naturalHeight || 512;
      const box = qs - 24 - 28;
      const k = Math.min(box / iw, box / ih);
      ctx.imageSmoothingEnabled = k < 1;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(q, qx + qs / 2 - iw * k / 2, qy + qs / 2 - ih * k / 2, iw * k, ih * k);
      ctx.imageSmoothingEnabled = true;
    } else {
      text('Chưa có QR', qx + qs / 2, qy + qs / 2, font(700, 28), 'rgba(0,0,0,.45)', 'center');
    }

    const tx = qx + qs + 60;
    const max = x + w - 60 - tx;
    shadow('rgba(0,0,0,.7)', 16, 5);
    const s1 = fit('QUÉT MÃ QR', 900, 104, max, 1);
    text('QUÉT MÃ QR', tx, qy + 166, font(900, s1), '#ffd98a', 'left', 1);
    const s2 = fit('để ngắm nhìn toàn cảnh', 700, 50, max);
    text('để ngắm nhìn toàn cảnh', tx, qy + 242, font(700, s2), '#fff');
    noShadow();

    const cf = font(800, 30);
    const cw = width('Video tổng hợp', cf) + 86;
    const cy = qy + 312;
    rr(tx, cy, cw, 64, 32);
    ctx.fillStyle = '#d9a02f';
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(tx + 26, cy + 20);
    ctx.lineTo(tx + 26, cy + 44);
    ctx.lineTo(tx + 46, cy + 32);
    ctx.closePath();
    ctx.fillStyle = '#1a1205';
    ctx.fill();
    text('Video tổng hợp', tx + 62, cy + 42, cf, '#1a1205');
  };

  const status = () => {
    info.textContent = st.qr
      ? '3840 × 2160 px · đã có QR'
      : 'Thiếu: yt.png · bấm “Chọn QR” để chọn file';
  };

  const draw = () => {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.setTransform(S, 0, 0, S, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    buildFrost();
    drawBg();
    drawHead();
    drawTitle();
    drawPanel();
  };

  const load = (src, cors) => new Promise((ok, no) => {
    const i = new Image();
    if (cors) i.crossOrigin = 'anonymous';
    i.onload = () => ok(i);
    i.onerror = no;
    i.src = src;
  });

  const save = (type, q, ext) => {
    try {
      cv.toBlob(b => {
        if (!b) return;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = 'poster-tong-hop-phuoc-hoa-4K.' + ext;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      }, type, q);
    } catch (e) {
      info.textContent = 'Không xuất được: có ảnh bị chặn từ nguồn ngoài · hãy dùng “Chọn QR” để chọn file';
    }
  };

  btnPng.addEventListener('click', () => save('image/png', undefined, 'png'));
  btnJpg.addEventListener('click', () => save('image/jpeg', .95, 'jpg'));

  document.getElementById('pick').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    load(URL.createObjectURL(f)).then(i => { st.img = i; draw(); status(); });
    e.target.value = '';
  });

  document.getElementById('pickqr').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    load(URL.createObjectURL(f)).then(i => { st.qr = i; draw(); status(); });
    e.target.value = '';
  });

  const sample = 'KHÔNG GIAN DU LỊCH SỐ PHƯỚC HÒA HÀNH TRÌNH XANH QUA MIỀN KÍ ỨC TRƯỜNG THCS QUÉT MÃ QR để ngắm nhìn toàn cảnh Video tổng hợp';
  const fonts = Promise.race([
    Promise.all(['600', '700', '800', '900'].map(w => document.fonts.load(`${w} 40px "Be Vietnam Pro"`, sample).catch(() => 0))),
    new Promise(r => setTimeout(r, 4000))
  ]);

  info.textContent = 'Đang tải ảnh, font và mã QR…';
  Promise.all([
    PHOTO ? load(PHOTO).catch(() => null) : Promise.resolve(null),
    load(QR_SRC).catch(() => null),
    fonts
  ]).then(r => {
    st.img = r[0];
    st.qr = r[1];
    draw();
    status();
    btnPng.disabled = false;
    btnJpg.disabled = false;
  });
})();
</script>
</body>
</html>
