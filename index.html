/* ===== BẢN VÁ: SỬA LỖI + 3D NÂNG CAO ===== */

/* font béo vừa */
html,body{font-weight:600}
.pill,.btn,.brand,.tabs button,#nv a,.ar.go,.gl,.seg em,.label,.facts dt{font-weight:700}

/* nhãn vàng: chip kính tối, hết lóa */
.label.gold{display:inline-flex;align-items:center;padding:.5rem 1.1rem;border-radius:999px;color:#ffd98a;background:rgba(7,15,12,.68);border:1px solid rgba(255,214,120,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 8px 20px rgba(0,0,0,.35);text-shadow:0 1px 2px rgba(0,0,0,.6)}
[data-theme=light] .label.gold{color:#ffd98a;background:rgba(7,15,12,.72);border-color:rgba(255,214,120,.55)}
.sub,.lead,.cue,.tags{text-shadow:0 2px 14px rgba(0,0,0,.6),0 1px 2px rgba(0,0,0,.5)}

/* FIX: tam giác đen slide 1 + chấm đen slide 2 */
.pg1{fill:none;stroke:#2aa39b;stroke-width:12;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 2;stroke-dashoffset:1}
.rp{fill:none;stroke:#2aa39b;stroke-width:3;opacity:0;transform-box:fill-box;transform-origin:center;pointer-events:none}
.rp.fire{animation:rg 2.2s ease-out both}
.rp.b.fire{animation-delay:.55s}
.hub{filter:drop-shadow(0 8px 6px rgba(0,0,0,.5))}

/* ghim + thẻ sáng lên theo điểm đang chạy */
.pn{transition:scale .5s var(--e)}
.pn.hot{scale:1.28}
.cd .cr{transition:fill .5s,stroke .5s}
.cd.hot .cr{fill:#143d40;stroke:rgba(255,255,255,.6)}
.m3 g.fi.sx{filter:saturate(.7) brightness(.8);transition:filter .5s}
.m3 g.fi.sx.hot{filter:none}
[data-go]{cursor:pointer}

/* tiêu đề 3D khối */
.hr{perspective:1000px}
.hr h1{transform-origin:0 100%;rotate:1 0 0 7deg;animation:up .8s var(--e) .15s backwards}
.hr .sub{animation:up .8s var(--e) .3s backwards}
.hr h1,.ct{color:#fff;text-shadow:0 1px 0 #dfe7e2,0 2px 0 #b4c2bb,0 3px 0 #8c9e96,0 4px 0 #6d807a,0 14px 24px rgba(0,0,0,.55)}
.pc .cap strong,.rc strong{text-shadow:0 1px 0 rgba(0,0,0,.6),0 2px 0 rgba(0,0,0,.35),0 4px 8px rgba(0,0,0,.5)}
.mp text[font-weight="800"],.mp text[font-weight="900"]{filter:drop-shadow(0 2px 0 #0a1a15) drop-shadow(0 4px 0 rgba(10,26,21,.7)) drop-shadow(0 9px 8px rgba(0,0,0,.45))}
.s1 .tx{padding-left:.5rem}
.s1 .title{transform:translateZ(24px)}
.floor{opacity:.5;bottom:-24%}

/* nút / chip nổi khối */
.pill,.btn,.ar,.cb button,.tg,.brand i{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -2px 0 rgba(0,0,0,.22),0 8px 18px rgba(0,0,0,.35)}
.pill.go:active,.btn:active,.ar:active,.cb button:active,.tg:active{translate:0 2px}
.nav{-webkit-backdrop-filter:blur(12px) saturate(1.3);backdrop-filter:blur(12px) saturate(1.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -3px 6px rgba(0,0,0,.25),0 18px 44px rgba(0,0,0,.4)}
.nav #nv a.on::before{box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 3px 6px rgba(0,0,0,.45)}
.tabs button.on{box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 0 rgba(0,0,0,.2),0 6px 14px rgba(0,0,0,.35)}
.seg i{height:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 3px 6px rgba(0,0,0,.3)}
.seg .on i{background:linear-gradient(90deg,#f6dd95,var(--gold))}
.pc .cap{box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -2px 0 rgba(0,0,0,.2),0 12px 26px rgba(0,0,0,.4)}
.pc .cap b{box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 0 rgba(0,0,0,.25),0 4px 8px rgba(0,0,0,.4)}
.pill,.panel,.cb button,.ar,.pc .cap{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}

/* gạch đầu dòng dạng viên ngọc vàng */
.hl li::before{left:.15rem;top:1.2rem;width:9px;height:9px;border-radius:2px;background:linear-gradient(135deg,#ffe7ab,#d9a02f 55%,#8d5a05);rotate:45deg;box-shadow:0 2px 4px rgba(0,0,0,.45)}
@media (max-height:520px){.hl li::before{top:.85rem}}

/* chuyển tab 3D */
.tp{transform:perspective(1100px) translate3d(0,18px,-60px) rotateX(-8deg)}
.tp.on{transform:none}

/* gallery: bỏ crop giả, ô trống "Đang cập nhật" */
.ring .th:nth-child(n) img{scale:1;transform-origin:50% 50%}
.ring .th.na{display:grid;place-items:center;cursor:inherit;border:1px dashed rgba(255,255,255,.38);background:repeating-linear-gradient(135deg,rgba(255,255,255,.08) 0 10px,transparent 10px 20px),linear-gradient(160deg,var(--c1),var(--c2))}
.th.na::after{content:'Đang cập nhật';font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;opacity:.9;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.lb[data-one="1"] .prev,.lb[data-one="1"] .next,.lb[data-one="1"] .n{display:none}

/* nền mượt hơn (không animate biến custom nữa) */
.bgs img{will-change:opacity,transform}
.bgs img.on{transform:none;scale:1.1;animation:flys 1.5s cubic-bezier(.2,.7,.2,1) backwards,kbs 26s ease-in-out 1.5s infinite alternate}
@keyframes kbs{from{scale:1.1}to{scale:1.2}}
@keyframes flys{from{scale:1.3}}

/* chuyển trang mượt (View Transitions, trình duyệt cũ tự bỏ qua) */
::view-transition-group(root){animation-duration:.5s}

/* ===== INTRO ĐIỆN ẢNH ===== */
.cine{position:fixed;inset:0;z-index:20;display:grid;place-items:center;overflow:hidden;perspective:1200px;background:#06100d;color:#f4f2ec;visibility:hidden;pointer-events:none;clip-path:inset(0 0 0 0 round 0px)}
.cine.in{visibility:visible;pointer-events:auto;animation:cin 1s cubic-bezier(.22,.8,.2,1) both}
.cine.out{visibility:visible;animation:cout .95s cubic-bezier(.65,0,.3,1) forwards}
@keyframes cin{from{clip-path:inset(var(--ct,50%) var(--cr,50%) var(--cb,50%) var(--cl,50%) round 28px)}to{clip-path:inset(0 0 0 0 round 0px)}}
@keyframes cout{0%{clip-path:circle(150% at 50% 50%);opacity:1}78%{opacity:1}100%{clip-path:circle(0% at 50% 50%);opacity:0}}

.cbg{position:absolute;inset:-5%;width:110%;height:110%;max-width:none;object-fit:cover;filter:saturate(1.1) brightness(.8)}
.cine:is(.in,.out) .cbg{animation:ckb 8s ease-out both}
@keyframes ckb{from{scale:1.2}to{scale:1.04}}
.cv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;opacity:0;transition:opacity 1s var(--e)}
.cine.vid .cv{opacity:1}
.cs{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 42%,rgba(6,16,13,.1),rgba(6,16,13,.82) 80%),linear-gradient(180deg,rgba(6,16,13,.5),transparent 35%,rgba(6,16,13,.8));transition:opacity 1s var(--e)}
.cine.vid .cs{opacity:0}

/* viền phim đen trên/dưới */
.cine::before,.cine::after{content:'';position:absolute;left:0;right:0;z-index:2;height:7vh;background:#000;pointer-events:none}
.cine::before{top:0;transform:translateY(-101%)}
.cine::after{bottom:0;transform:translateY(101%)}
.cine:is(.in,.out)::before,.cine:is(.in,.out)::after{animation:lbar .9s cubic-bezier(.2,.7,.2,1) .55s forwards}
@keyframes lbar{to{transform:none}}

.cc{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;gap:clamp(.7rem,2.4vh,1.4rem);width:min(72rem,100%);padding:0 1.25rem;text-align:center;transition:opacity .7s var(--e),transform .9s var(--e)}
.cine:is(.in,.out) .cc{animation:sw 8s ease-in-out infinite alternate}
.cine.vid .cc{opacity:0;transform:translateY(-26px) scale(.95)}
.cn{display:block;font-size:clamp(4.5rem,20vh,12rem);font-weight:900;line-height:.9;letter-spacing:-.04em;color:#ffe2a0;text-shadow:0 1px 0 #f0c25f,0 2px 0 #d9a02f,0 3px 0 #c08d25,0 4px 0 #a57716,0 5px 0 #8a6210,0 6px 0 #6f4e0b,0 24px 30px rgba(0,0,0,.55)}
.cine:is(.in,.out) .cn{animation:cnin 1.1s cubic-bezier(.2,.8,.2,1) .5s both}
@keyframes cnin{from{opacity:0;transform:perspective(900px) translateY(70px) rotateX(75deg) scale(.7)}}
.ck{display:inline-flex;max-width:100%;padding:.55rem 1.2rem;border-radius:999px;font-size:clamp(.7rem,1.5vw,.85rem);font-weight:700;letter-spacing:.14em;line-height:1.4;text-transform:uppercase;color:#ffd98a;background:rgba(7,15,12,.66);border:1px solid rgba(255,214,120,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 8px 20px rgba(0,0,0,.4)}
.cine:is(.in,.out) .ck{animation:up .8s var(--e) .95s both}
.ct{margin:0;max-width:60rem;font-size:clamp(1.7rem,min(6vw,10.5vh),4.6rem);font-weight:900;line-height:1.1;letter-spacing:-.02em;text-transform:uppercase;text-wrap:balance;perspective:800px}
.cw{display:inline-block;white-space:nowrap;transform-origin:50% 100%}
.cine:is(.in,.out) .cw{animation:cw .85s cubic-bezier(.2,.8,.2,1) calc(.9s + var(--i)*.07s) both}
@keyframes cw{from{opacity:0;transform:perspective(700px) translateY(.7em) rotateX(-85deg)}}
.cl{display:block;width:min(18rem,56vw);height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,#d9a02f,#f6dd95,#d9a02f,transparent);transform-origin:center}
.cine:is(.in,.out) .cl{animation:wd 1s var(--e) 1.5s both}

.l3{position:absolute;z-index:3;left:calc(var(--pad) + var(--il));bottom:calc(7vh + 1.4rem + var(--ib));display:flex;align-items:center;gap:.8rem;max-width:calc(100% - var(--pad)*2);padding:.5rem 1.1rem .5rem .55rem;border-radius:999px;background:rgba(8,16,13,.62);border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 14px 30px rgba(0,0,0,.45);opacity:0;transform:translateY(20px);transition:opacity .8s var(--e) 1s,transform .8s var(--e) 1s}
.cine.vid .l3{opacity:1;transform:none}
.l3 b{display:grid;place-items:center;flex:none;width:2.2rem;height:2.2rem;border-radius:.65rem;background:#d9a02f;color:#1a1205;font-size:.85rem;font-weight:900;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(0,0,0,.22)}
.l3 span{font-size:.85rem;font-weight:800;line-height:1.3;letter-spacing:.04em;text-transform:uppercase;text-shadow:0 1px 2px rgba(0,0,0,.6)}

.cp{position:absolute;z-index:4;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.16)}
.cp i{display:block;width:100%;height:100%;background:linear-gradient(90deg,#d9a02f,#f6dd95);transform-origin:0 50%;transform:scaleX(0);box-shadow:0 0 10px rgba(246,221,149,.7)}
.csk,.cmu{position:absolute;z-index:5;top:calc(7vh + .9rem + var(--it));display:inline-flex;align-items:center;height:2.4rem;padding:0 1.1rem;border-radius:999px;background:rgba(8,16,13,.62);border:1px solid rgba(255,255,255,.28);color:#fff;font-size:.8rem;font-weight:700;letter-spacing:.06em;text-align:center;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 8px 18px rgba(0,0,0,.4);transition:background .3s}
.csk{right:calc(var(--pad) + var(--ir))}
.cmu{right:calc(var(--pad) + var(--ir) + 7rem)}
.cmu[hidden]{display:none}
.csk:hover,.cmu:hover{background:rgba(244,242,236,.2)}
.cine:is(.in,.out) .csk{animation:up .6s var(--e) .8s backwards}



.pane p.hint{font-size:.85rem}
.cfw{display:flex;flex-direction:column;gap:.7rem}
.cf{position:relative;height:var(--ph);perspective:1100px;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.cf:active{cursor:grabbing}
.cf:focus-visible{outline-offset:6px}
.cf .th{position:absolute;left:50%;top:0;width:64%;height:100%;aspect-ratio:auto;border:1px solid rgba(255,255,255,.24);border-radius:1rem;cursor:pointer;box-shadow:0 18px 36px rgba(0,0,0,.5);opacity:calc(1 - var(--a,0)*.24);transform:translateX(-50%) translateX(calc(var(--c,0)*42%)) translateZ(calc(var(--a,0)*-140px)) rotateY(calc(var(--c,0)*-30deg));transition:transform .6s var(--e),opacity .5s,box-shadow .4s}
.cf .th.far{opacity:0;pointer-events:none}
.cf .th.ctr{border-color:rgba(255,217,138,.85);box-shadow:0 24px 48px rgba(0,0,0,.55),0 0 0 2px rgba(217,160,47,.55)}
.cf .th img{pointer-events:none;-webkit-user-drag:none}
.cf .th:not(.ctr):hover img{transform:none}
.cf .th.na{border-style:dashed;background:repeating-linear-gradient(135deg,rgba(255,255,255,.08) 0 10px,transparent 10px 20px),linear-gradient(160deg,var(--c1),var(--c2))}
.cfb{display:flex;align-items:center;justify-content:center;gap:.6rem}
.cfb button{display:grid;place-items:center;min-width:2.8rem;height:2.8rem;padding:0 .9rem;border-radius:999px;background:var(--ink);color:var(--bg);font-size:1.3rem;font-weight:700;text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -2px 0 rgba(0,0,0,.22),0 8px 18px rgba(0,0,0,.35)}
.cfb .cfa{font-size:.85rem;background:var(--glass);color:var(--ink);border:1px solid var(--line)}
.cfb .cfa[aria-pressed="true"]{background:var(--gold);color:#1a1205;border-color:transparent}
.cfn{min-width:4.2rem;text-align:center;font-size:.95rem;font-weight:800;color:var(--ink)}
.pc img.inc{animation:ifade .9s var(--e) backwards}
@keyframes ifade{from{opacity:0}}
@keyframes slr{from{opacity:0;transform:translate3d(-60px,0,0)}}
@keyframes zin{from{opacity:0;transform:scale(.92)}}
@keyframes bl{from{opacity:0;filter:blur(14px);transform:scale(1.05)}}
.slide[data-n="2"]{animation:zin .8s var(--e) backwards}
.slide[data-n="3"]{animation:slr .8s var(--e) backwards}
.stop[data-v="1"] .hd .pill{animation:slr .7s var(--e) .3s backwards}
.stop[data-v="1"] .hd h1{animation:slr .9s var(--e) .4s backwards}
.stop[data-v="1"] .hd .lead{animation:slr .9s var(--e) .55s backwards}
.stop[data-v="1"] .panel{animation:zin .9s var(--e) .3s backwards,bp 9s ease-in-out 1.4s infinite alternate}
.stop[data-v="2"] .hd :is(.pill,h1,.lead){animation:bl 1.1s var(--e) .35s backwards}
.stop[data-v="2"] .panel{animation:bl 1.1s var(--e) .3s backwards,bp 9s ease-in-out 1.4s infinite alternate}
@keyframes cin1{from{clip-path:inset(0 50% 0 50%)}to{clip-path:inset(0 0 0 0)}}
@keyframes cin2{from{clip-path:circle(0% at 50% 55%)}to{clip-path:circle(150% at 50% 55%)}}
@keyframes cout1{from{clip-path:inset(0 0 0 0)}to{clip-path:inset(50% 0 50% 0)}}
@keyframes cout2{to{opacity:0;transform:scale(1.06);filter:blur(10px)}}
@keyframes cw1{from{opacity:0;transform:translateX(calc(var(--dir)*90px)) skewX(calc(var(--dir)*-18deg))}}
@keyframes cw2{from{opacity:0;filter:blur(14px);transform:translateY(14px) scale(1.08)}}
@keyframes cn1{from{opacity:0;transform:perspective(900px) translateX(-140px) rotateY(80deg)}}
@keyframes cn2{from{opacity:0;filter:blur(18px);transform:scale(1.7)}}
@keyframes ckb1{from{scale:1.18;translate:5% 0}to{scale:1.1;translate:-3% 0}}
@keyframes ckb2{from{scale:1.02;filter:saturate(1.1) brightness(.5) blur(6px)}to{scale:1.14;filter:saturate(1.1) brightness(.8) blur(0)}}
.cine.v1.in{animation:cin1 1.1s cubic-bezier(.7,0,.2,1) both}
.cine.v2.in{animation:cin2 1.2s cubic-bezier(.3,.7,.2,1) both}
.cine.v1.out{animation:cout1 .9s cubic-bezier(.65,0,.3,1) forwards}
.cine.v2.out{animation:cout2 .9s ease forwards}
.cine.v1 .cw:nth-child(odd){--dir:-1}
.cine.v1 .cw:nth-child(even){--dir:1}
.cine.v1:is(.in,.out) .cw{animation:cw1 .8s cubic-bezier(.2,.8,.2,1) calc(1s + var(--i)*.08s) both}
.cine.v2:is(.in,.out) .cw{animation:cw2 1.1s ease calc(1s + var(--i)*.12s) both}
.cine.v1:is(.in,.out) .cn{animation:cn1 1.1s cubic-bezier(.2,.8,.2,1) .6s both}
.cine.v2:is(.in,.out) .cn{animation:cn2 1.4s ease .6s both}
.cine.v1:is(.in,.out) .cbg{animation:ckb1 8s ease-out both}
.s1 .ptx{font-size:.78rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.92);text-shadow:0 2px 14px rgba(0,0,0,.6),0 1px 2px rgba(0,0,0,.5)}
.label.gold.plain,[data-theme=light] .label.gold.plain{padding:0;border:0;background:none;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
@media (max-height:400px){.s1 .ptx{display:none}}
.tg .sf{display:none}
#snd[aria-pressed="false"] .so{display:none}
#snd[aria-pressed="false"] .sf{display:block}
.nav #nv a{width:1.2rem}
.end .title{font-size:clamp(2.2rem,min(9.5vw,15vh),6.8rem)}
.end .hero .sub{max-width:44rem;font-size:clamp(.88rem,1.5vw,1.12rem);line-height:1.65}
.ea{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.6rem;margin-top:.4rem}
.ea .pill{height:2.8rem;padding:0 1.4rem;font-size:.88rem}
@media (max-height:640px){.end .title{font-size:clamp(1.6rem,min(7vw,11vh),3.6rem)}.end .hero .sub{display:none}}
@media (max-height:520px){.ea .pill{height:2.2rem;padding:0 1rem;font-size:.78rem}}
.cine.nr{animation:none!important}
.cine.out .csk{visibility:hidden}
.vo{position:fixed;inset:0;z-index:15;display:grid;grid-template-rows:auto minmax(0,1fr);gap:.8rem;padding:calc(var(--it) + 1rem) calc(var(--pad) + var(--ir)) calc(var(--ib) + 1.2rem) calc(var(--pad) + var(--il));overflow:hidden;background:#06100d;color:#f4f2ec;visibility:hidden;opacity:0;pointer-events:none;transition:opacity .7s var(--e),visibility 0s .7s}
.vo.on{visibility:visible;opacity:1;pointer-events:auto;transition:opacity .7s var(--e)}
.vo.ins,.vo.ins.on{transition:none}
.vbg{position:absolute;inset:-6%;width:112%;height:112%;max-width:none;object-fit:cover;filter:blur(20px) saturate(1.1) brightness(.38)}
.vh{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:.8rem;min-width:0}
.vk{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vsk{flex:none;display:inline-flex;align-items:center;height:2.4rem;padding:0 1.1rem;border-radius:999px;background:rgba(8,16,13,.62);border:1px solid rgba(255,255,255,.28);color:#fff;font-size:.8rem;font-weight:700;letter-spacing:.06em;text-align:center;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 8px 18px rgba(0,0,0,.4);transition:background .3s}
.vsk:hover{background:rgba(244,242,236,.2)}
.vf{position:relative;z-index:1;display:grid;place-items:center;min-height:0;perspective:1400px}
.vb{width:min(68rem,100%,calc((100vh - 7.5rem - var(--it) - var(--ib))*1.7778));aspect-ratio:16/9;overflow:hidden;border-radius:calc(var(--r)*.6);background:#000;border:1px solid rgba(255,217,138,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 40px 90px rgba(0,0,0,.6)}
.vb{position:relative}
.vb iframe{display:block;width:100%;height:100%;border:0}
.vm{position:absolute;left:0;right:0;bottom:0;padding:.7rem 1rem;text-align:center;font-size:.85rem;font-weight:700;color:#ffd98a;background:rgba(0,0,0,.72)}
.vo.on .vb{animation:vin 1s var(--e) .15s backwards}
@keyframes vin{from{opacity:0;transform:perspective(1400px) rotateX(16deg) translateY(50px) scale(.9)}}
body.vp .app{visibility:hidden}
.cine.v2:is(.in,.out) .cbg{animation:ckb2 8s ease-out both}
/* ===== BẢN VÁ 3: CỠ CHỮ / BỐ CỤC VỪA THIẾT BỊ ===== */
.end .hero{gap:clamp(.4rem,1.4vh,.9rem)}
.end .title{font-size:clamp(1.6rem,min(7.5vw,10.5vh),4.6rem);line-height:1.04}
.end .hero .sub{max-width:40rem;font-size:clamp(.82rem,1.25vw,1rem);line-height:1.6}
.end .pcs{height:clamp(7rem,24vh,13rem)}
.end .ea .pill{height:2.6rem;padding:0 1.2rem;font-size:.84rem}
@media (max-height:680px){.end .hero .sub{display:none}}
@media (max-height:640px){.end .title{font-size:clamp(1.4rem,min(6vw,9vh),3rem)}}

    music(wantK, 3500);
  };
  ['pointerdown', 'keydown', 'touchstart'].forEach(ev => addEventListener(ev, unlock, { passive: true }));

  const probe = () => {
    const a = new Audio(TRACK.home);
    a.volume = 0;
    const p = a.play();
    if (p && p.then) p.then(() => { a.pause(); unlock(); }, () => {});
  };
  probe();

  sndBtn.setAttribute('aria-pressed', sndOn);
  sndBtn.addEventListener('click', () => {
    sndOn = !sndOn;
    try { localStorage.setItem('ph-snd', sndOn ? '1' : '0'); } catch (e) {}
    sndBtn.setAttribute('aria-pressed', sndOn);
    Object.keys(aud).forEach(k => { aud[k].muted = !sndOn; });
    const a = curK && aud[curK];
    if (a) fade(a, level(), 600);
  });

  document.addEventListener('visibilitychange', () => {
    const a = curK && aud[curK];
    if (a) fade(a, document.hidden ? 0 : level(), 500);
  });

  const loadYT = () => ytp || (ytp = new Promise((ok, no) => {
    if (window.YT && window.YT.Player) { ok(); return; }
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { if (prev) prev(); ok(); };
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    s.onerror = () => { ytp = null; no(); };
    document.head.appendChild(s);
  }));

  const playVideo = (id, label, img, instant) => new Promise(ok => {
    let fin = false;
    let played = false;
    let ft = 0;
    const done = () => {
      if (fin) return;
      fin = true;
      clearTimeout(ft);
      if (skipCur === done) skipCur = null;
      const pl = vplayer;
      try { if (pl && pl.mute) pl.mute(); } catch (e) {}
      try { if (pl && pl.stopVideo) pl.stopVideo(); } catch (e) {}
      try { if (pl && pl.pauseVideo) pl.pauseVideo(); } catch (e) {}
      $$('iframe', vbox).forEach(f => { try { f.src = 'about:blank'; } catch (e) {} });
      ok();
    };
    const clearMsg = () => {
      const m = vbox.querySelector('.vm');
      if (m) m.remove();
    };
    const fail = () => {
      if (fin || vbox.querySelector('.vm')) return;
      const m = document.createElement('div');
      m.className = 'vm';
      m.textContent = 'Không phát được video. Bấm "Bỏ qua" để tiếp tục.';
      vbox.appendChild(m);
    };
    skipCur = done;
    $('.vk', vo).textContent = label;
    $('.vbg', vo).src = img;
    vbox.textContent = '';
    const fr = document.createElement('iframe');
    fr.src = 'https://www.youtube.com/embed/' + id + '?enablejsapi=1&autoplay=1&rel=0&playsinline=1&modestbranding=1&iv_load_policy=3' + (/^https?:$/.test(location.protocol) ? '&origin=' + encodeURIComponent(location.origin) : '');
    fr.title = label;
    fr.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
    fr.referrerPolicy = 'strict-origin-when-cross-origin';
    fr.allowFullscreen = true;
    vbox.appendChild(fr);
    if (instant) {
      vo.classList.add('ins');
      setTimeout(() => vo.classList.remove('ins'), 80);
    }
    vo.classList.add('on');
    vo.setAttribute('aria-hidden', 'false');
    clearTimeout(vpT);
    vpT = setTimeout(() => document.body.classList.add('vp'), 900);
    ft = setTimeout(fail, 20000);
    loadYT().then(() => {
      if (fin) return;
      try {
        vplayer = new YT.Player(fr, {
          events: {
            onReady: () => { clearTimeout(ft); clearMsg(); },
            onStateChange: e => {
              if (e.data === 1) { played = true; clearMsg(); }
              else if (e.data === 0 && played) done();
            },
            onError: fail
          }
        });
      } catch (err) { fail(); }
    }, fail);
  });

  const closeVideo = () => {
    clearTimeout(vpT);
    document.body.classList.remove('vp');
    vo.classList.remove('on');
    vo.setAttribute('aria-hidden', 'true');
    const p = vplayer;
    vplayer = null;
    const olds = $$('iframe', vbox);
    setTimeout(() => {
      try { if (p) p.destroy(); } catch (e) {}
      olds.forEach(f => { try { f.src = 'about:blank'; f.remove(); } catch (e) {} });
    }, 800);
  };

  const stage = ms => new Promise(ok => {
    let t = 0;
    const done = () => {
      clearTimeout(t);
      if (skipCur === done) skipCur = null;
      ok();
    };
    t = setTimeout(done, ms);
    skipCur = done;
  });

  const restartInner = () => {
    if (!cine.getAnimations) return;
    cine.getAnimations({ subtree: true }).forEach(a => {
      if (/^(cin|lbar)/.test(a.animationName || '')) return;
      a.cancel();
      a.play();
    });
  };

  const card = async (o, opt) => {
    await preload(o.img);
    cv = o.i;
    $('.cbg', cine).src = o.img;
    $('.cn', cine).textContent = o.num;
    $('.ck', cine).textContent = o.kick;
    $('.ct', cine).innerHTML = o.title.split(' ').map((w, k) => `<span class="cw" style="--i:${k}">${esc(w)}</span>`).join(' ');
    cbar.style.transition = 'none';
    cbar.style.transform = 'scaleX(0)';
    if (opt.chain) {
      cine.className = 'cine v' + o.i + ' in nr';
      restartInner();
    } else {
      const r = opt.rect;
      ['--ct', '--cl', '--cr', '--cb'].forEach(k => cine.style.removeProperty(k));
      if (r) {
        cine.style.setProperty('--ct', Math.max(0, Math.round(r.top)) + 'px');
        cine.style.setProperty('--cl', Math.max(0, Math.round(r.left)) + 'px');
        cine.style.setProperty('--cr', Math.max(0, Math.round(innerWidth - r.right)) + 'px');
        cine.style.setProperty('--cb', Math.max(0, Math.round(innerHeight - r.bottom)) + 'px');
      }
      cine.className = 'cine';
      void cine.offsetWidth;
      cine.className = 'cine v' + o.i + ' in';
    }
    cine.setAttribute('aria-hidden', 'false');
    void cbar.offsetWidth;
    cbar.style.transition = 'transform ' + opt.ms + 'ms linear';
    cbar.style.transform = 'scaleX(1)';
    clearTimeout(hideT);
    hideT = setTimeout(() => cls.add('ch'), opt.chain ? 0 : 1300);
    return stage(opt.ms);
  };

  const cineOut = () => new Promise(ok => {
    cine.className = 'cine v' + cv + ' out';
    setTimeout(() => {
      cine.className = 'cine';
      cine.setAttribute('aria-hidden', 'true');
      ok();
    }, 950);
  });

  const introOf = i => {
    const p = PLACES[i];
    return { i, num: pad2(i + 1), kick: p.category + ' · ' + p.route, title: p.name, img: p.image };
  };

  const outroOf = (i, last) => {
    const p = PLACES[i];
    return last
      ? { i, num: pad2(i + 1), kick: 'Hoàn thành ' + pad2(PLACES.length) + ' / ' + pad2(PLACES.length) + ' điểm đến', title: 'Kết thúc hành trình', img: p.image }
      : { i, num: pad2(i + 1), kick: 'Kết thúc điểm đến ' + pad2(i + 1) + ' · ' + p.short, title: 'Cảm ơn đã dừng chân', img: p.image };
  };

  const enter = h => {
    if (location.hash !== h) noVT = true;
    location.hash = h;
    return sleep(90).then(() => new Promise(r => requestAnimationFrame(() => r()))).then(() => { unveil(); return cineOut(); });
  };

  const go = async (h, x, y) => {
    if (busy) return;
    const m = h.match(/^#\/dia-diem\/([\w-]+)/);
    const i = m ? PLACES.findIndex(p => p.slug === m[1]) : -1;
    const pl = PLACES[i];
    if (still || !pl) { location.hash = h; return; }

    const full = parse().t !== 's';               // từ trang chủ/slide: có video; chuyển qua lại giữa các điểm: chỉ thẻ tiêu đề

    const el = view.querySelector('[data-go="' + pl.slug + '"]');
    const cx = x || innerWidth / 2;
    const cy = y || innerHeight / 2;
    const r = el ? el.getBoundingClientRect() : { left: cx, top: cy, right: cx, bottom: cy };
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    busy = true;
    try {
      music(KEYS[i], 2600);
      veil();
      await card(introOf(i), { rect: r, ms: full ? 3400 : 2400 });
      await enter(h);
    } finally {
      busy = false;
    }
  };

  const advance = async () => {
    if (busy || !st.slug) return;
    const i = PLACES.findIndex(p => p.slug === st.slug);
    if (i < 0) return;
    const pl = PLACES[i];
    const nx = PLACES[i + 1];
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    busy = true;
    try {
      veil();
      music(null, 900);
      await playVideo(VIDS[i], pad2(i + 1) + ' · Video · ' + pl.short, pl.image);
      if (nx) {
        if (still) {
          closeVideo();
          location.hash = '#/dia-diem/' + nx.slug;
          return;
        }
        const c = card(outroOf(i), { ms: 2600 });
        await sleep(1100);
        closeVideo();
        await c;
        music(KEYS[i + 1], 2600);
        await card(introOf(i + 1), { chain: true, ms: 3000 });
        await enter('#/dia-diem/' + nx.slug);
      } else {
        let v;
        if (still) {
          closeVideo();
          v = playVideo(VID_ALL, 'Video tổng hợp · Phước Hòa', SITE.hero);
        } else {
          const c = card(outroOf(i, true), { ms: 2600 });
          await sleep(1100);
          closeVideo();
          await c;
          v = playVideo(VID_ALL, 'Video tổng hợp · Phước Hòa', SITE.hero, true);
          await cineOut();
        }
        await v;
        music('home', 3000);
        if (location.hash !== '#/ket-thuc') noVT = true;
        location.hash = '#/ket-thuc';
        await sleep(120);
        unveil();
        closeVideo();
        await sleep(800);
      }
    } finally {
      busy = false;
    }
  };

  const replay = async () => {
    if (busy) return;
    busy = true;
    try {
      veil();
      music(null, 700);
      await playVideo(VID_ALL, 'Video tổng hợp · Phước Hòa', SITE.hero);
      music('home', 2500);
      unveil();
      closeVideo();
      await sleep(800);
    } finally {
      busy = false;
    }
  };





  $('.csk', cine).addEventListener('click', () => { if (skipCur) skipCur(); });
  $('.vsk', vo).addEventListener('click', () => { if (skipCur) skipCur(); });
  addEventListener('keydown', e => {
    if (!busy) return;
    e.stopImmediatePropagation();
    const k = e.key;
    if (k === 'Escape' || ((k === 'Enter' || k === ' ') && !vo.classList.contains('on'))) {
      e.preventDefault();
      if (skipCur) skipCur();
    }
  }, true);
  setTimeout(() => loadYT().catch(() => {}), 1500);
  setTimeout(() => { PLACES.forEach(p => preload(p.image)); preload(SITE.hero); }, 900);
  setInterval(() => { if (!busy && cls.contains('cx')) unveil(); }, 1500);

  const spinRing = () => {
    const host = $('.ring', view);
    const rg = $('.ring>div', view);
    if (!host || !rg) return;
    const base = still ? 0 : .12;
    let a = 0, v = base, drag = false, lx = 0, mv = 0;
    host.addEventListener('pointerdown', e => {
      drag = true;
      lx = e.clientX;
      mv = 0;
      const move = ev => {
        const dx = ev.clientX - lx;
        lx = ev.clientX;
        mv += Math.abs(dx);
        a += dx * .45;
        v = dx * .45;
      };
      const up = () => {
        drag = false;
        ringDrag = mv > 6;
        setTimeout(() => { ringDrag = false; }, 80);
        removeEventListener('pointermove', move);
        removeEventListener('pointerup', up);
        removeEventListener('pointercancel', up);
      };
      addEventListener('pointermove', move);
      addEventListener('pointerup', up);
      addEventListener('pointercancel', up);
    });
        const loop = () => {
      if (!rg.isConnected) return;
      if (host.closest('.tp.on')) {
        if (!drag) {
          a += v;
          v += (base - v) * .04;
        }
        rg.style.transform = `rotateY(${a}deg)`;
      }
      requestAnimationFrame(loop);
    };
    loop();
  };

  const par = { x: 0, y: 0, cx: 0, cy: 0, raf: 0 };
  let ptg = [];
  const PAR = [
    ['.bgs img', 'translate', (x, y) => `${x * -14}px ${y * -9}px`],
    ['.hero', 'transform', (x, y) => `rotateX(${y * -3}deg) rotateY(${x * 4}deg)`],
    ['.s1 .tx', 'transform', (x, y) => `rotateY(${6 + x * 3}deg) rotateX(${y * -3}deg)`],
    ['.s1 .mp', 'transform', (x, y) => `rotateX(${8 + y * -3}deg) rotateY(${-8 + x * -4}deg)`],
    ['.mapbox .mp', 'transform', (x, y) => `rotateX(${9 + y * -2}deg) rotateY(${x * 3}deg) scale(.95)`],
    ['.panel', 'transform', (x, y) => `rotateY(${-4 + x * -3}deg) rotateX(${y * 2}deg)`]
  ];
  const cachePar = () => { ptg = PAR.map(([s, p, f]) => [$$(s), p, f]); };
  const parTick = () => {
    par.cx += (par.x - par.cx) * .1;
    par.cy += (par.y - par.cy) * .1;
    ptg.forEach(([els, p, f]) => {
      const v = f(par.cx.toFixed(3), par.cy.toFixed(3));
      els.forEach(el => { el.style[p] = v; });
    });
    par.raf = Math.abs(par.x - par.cx) + Math.abs(par.y - par.cy) > .002 ? requestAnimationFrame(parTick) : 0;
  };
  let tiltEl = null;
  const tiltOff = el => {
    if (!el) return;
    ['--mx', '--my', '--gx', '--gy'].forEach(k => el.style.removeProperty(k));
  };

  addEventListener('pointermove', e => {
    if (still || busy || e.pointerType === 'touch') return;
    const t = e.target.closest ? e.target.closest('[data-tilt]') : null;
    if (t !== tiltEl) { tiltOff(tiltEl); tiltEl = t; }
    if (t) {
      const r = t.getBoundingClientRect();
      const u = (e.clientX - r.left) / r.width;
      const w = (e.clientY - r.top) / r.height;
      t.style.setProperty('--mx', (u * 2 - 1).toFixed(3));
      t.style.setProperty('--my', (w * 2 - 1).toFixed(3));
      t.style.setProperty('--gx', (u * 100).toFixed(1) + '%');
      t.style.setProperty('--gy', (w * 100).toFixed(1) + '%');
    }
        par.x = e.clientX / innerWidth * 2 - 1;
    par.y = e.clientY / innerHeight * 2 - 1;
    if (!par.raf) par.raf = requestAnimationFrame(parTick);
  }, { passive: true });

  document.documentElement.addEventListener('pointerleave', () => { tiltOff(tiltEl); tiltEl = null; });

  $('#tg').addEventListener('click', toggleTheme);
  let rz = 0;
  addEventListener('resize', () => {
    cancelAnimationFrame(rz);
    rz = requestAnimationFrame(fit);
  });
  paintTheme();
  if (document.fonts) document.fonts.ready.then(fit);

  if (!location.hash) history.replaceState(null, '', '#/mo-dau/1');
  render();
})();
</script>
</body>
</html>
